name: End-to-end (Android)

# Builds the debug app, starts an emulator and runs the Maestro flows in e2e/flows against the live schedule.
# Manual: an emulator run takes several minutes.
on:
  workflow_dispatch:

jobs:
  e2e:
    name: Maestro flows on an Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the debug app
        run: ./gradlew :app:androidApp:assembleDebug
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run the flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb install -r app/androidApp/build/outputs/apk/debug/androidApp-debug.apk
            maestro test --format junit --output e2e-report.xml e2e/flows
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e-report.xml
            ~/.maestro/tests
