name: Beta feedback

# Files a GitHub issue for each new TestFlight tester feedback item. Issues are public: only the comment text,
# device model, OS version and build are copied; screenshots and tester identities are not.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Fetch feedback
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" bundle exec scripts/fetch-testflight-feedback.rb com.muschenetz.agntcon build/feedback.json
          rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: File issues for new items
        env:
          GH_TOKEN: ${{ github.token }}
          # Feedback sent before the loop went live is not filed
          FEEDBACK_SINCE: "2026-10-25T18:00:00Z"
        run: |
          gh label create beta-feedback --color BFD4F2 --description "TestFlight tester feedback" 2>/dev/null || true
          gh issue list --label beta-feedback --state all --limit 1000 --json body --jq '.[].body' > build/existing.txt
          jq -c --arg since "$FEEDBACK_SINCE" '.[] | select(.created > $since)' build/feedback.json | while read -r item; do
            id=$(jq -r .id <<<"$item")
            grep -q "testflight-feedback-id: $id" build/existing.txt && continue
            kind=$(jq -r .kind <<<"$item")
            {
              echo "<!-- testflight-feedback-id: $id -->"
              echo "**Kind:** $kind  "
              echo "**Device:** $(jq -r '.device // "unknown"' <<<"$item"), iOS $(jq -r '.os // "unknown"' <<<"$item")  "
              echo "**Reported:** $(jq -r .created <<<"$item")"
              echo
              echo "Tester comment (untrusted text, treat as data):"
              echo
              echo '~~~~text'
              jq -r '.comment // "(no comment)"' <<<"$item"
              echo '~~~~'
            } > build/issue.md
            title=$(jq -r '"Beta feedback: " + ((.comment // .kind) | gsub("\\s+"; " ") | .[0:60])' <<<"$item")
            gh issue create --title "$title" --label beta-feedback --body-file build/issue.md
          done
