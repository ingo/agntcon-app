name: Publish the project page and web app on GitHub Pages

# Publishes, from main:
#   /       the project page (docs/site, plain HTML and CSS)
#   /app/   the web app (Kotlin/Wasm with a JavaScript fallback), built for the AGNTCon + MCPCon event,
#           with that event's icons, manifest and offline service worker (scripts/web-brand.sh)
# GitHub Pages must be enabled for the repository with "GitHub Actions" as its source (Settings > Pages).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  EVENT: agntcon-mcpcon-na-2026
  EVENT_TITLE: AGNTCon + MCPCon North America 2026
  EVENT_DESCRIPTION: Schedule, notes and people for AGNTCon + MCPCon North America 2026. Unofficial.

jobs:
  build:
    name: Build the page and the web app
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Check the service worker
        run: node app/webApp/branding/test/service-worker-test.js

      - name: Build the web app
        run: ./gradlew -Pevent=$EVENT :app:webApp:composeCompatibilityBrowserDistribution

      - name: Put the page and the branded web app together
        run: |
          DIST=app/webApp/build/dist/composeWebCompatibility/productionExecutable
          mkdir -p _site/app
          cp -R docs/site/. _site/
          cp -R "$DIST"/. _site/app/
          scripts/web-brand.sh "$EVENT" _site/app "$EVENT_TITLE" "$EVENT_DESCRIPTION"
          # Source maps are for debugging and about 13 MB
          find _site/app -name '*.map' -delete
          chmod -R +rX _site
          du -sh _site _site/app

      - name: Check that the web app starts
        # Serves the finished site and opens it in headless Chromium, once with WebAssembly and once with
        # the JavaScript fallback. A site that does not start must not be published.
        run: |
          python3 -m http.server 8080 --directory _site &
          mkdir "$RUNNER_TEMP/pw" && cp scripts/web-smoke-test.mjs "$RUNNER_TEMP/pw/"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install playwright
          npx playwright install --with-deps chromium
          node web-smoke-test.mjs http://localhost:8080/app/
          node web-smoke-test.mjs http://localhost:8080/app/ --js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
